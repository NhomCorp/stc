<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --faint: #94a3b8;
      --line: #e2e8f0;
      --soft: #f8fafc;
      --blue: #2563eb;
      --ok: #047857;
      --ok-bg: #ecfdf5;
      --err: #b91c1c;
      --err-bg: #fef2f2;
      --wait: #1d4ed8;
      --wait-bg: #eff6ff;
      --r: 10px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      margin: 0; padding: 8px;
      color: var(--ink); background: #e8edf4;
    }
    #app {
      position: relative;
      display: flex; flex-direction: column;
      height: 100%; min-height: 0; width: 100%; max-width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    #app.busy { pointer-events: none; }
    #app.busy::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; z-index: 3;
      height: 2px; background: linear-gradient(90deg, var(--blue), #93c5fd);
    }

    .chrome { flex-shrink: 0; padding: 10px 10px 0; border-bottom: 1px solid #f1f5f9; }
    .scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 10px; }

    .head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; padding-bottom: 10px;
    }
    .head h1 {
      margin: 0; font-size: 15px; letter-spacing: -0.02em; line-height: 1.2;
      min-width: 0; flex: 1;
    }
    .head-nav { display: flex; gap: 4px; flex-shrink: 0; }
    .nav-back {
      display: inline-flex; align-items: center;
      border: 1px solid var(--line); background: #fff; color: #334155;
      border-radius: 8px; padding: 5px 7px;
      font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .nav-back:hover { background: var(--soft); }

    .period { margin-bottom: 8px; }
    .period label {
      display: block; font-size: 10px; font-weight: 700; color: var(--muted);
      letter-spacing: .04em; text-transform: uppercase; margin-bottom: 5px;
    }
    .month-row { display: flex; align-items: stretch; gap: 4px; }
    .month-nav {
      flex-shrink: 0; width: 28px; border: 1px solid var(--line); background: #fff;
      border-radius: 8px; cursor: pointer; color: #334155;
      display: flex; align-items: center; justify-content: center;
    }
    .month-nav:disabled { opacity: .35; cursor: not-allowed; }
    .month-nav:not(:disabled):hover { background: var(--soft); }
    #month {
      flex: 1; min-width: 0; width: 100%; padding: 7px 8px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    }
    #month:disabled { color: var(--faint); font-weight: 500; }
    .period-msg { font-size: 11px; margin-top: 5px; color: var(--muted); overflow-wrap: anywhere; }
    .period-msg:empty { display: none; }
    .period-msg.wait { color: var(--wait); }
    .period-msg.err { color: var(--err); }

    .block {
      border: 1px solid var(--line); border-radius: var(--r);
      padding: 8px; margin-bottom: 8px; background: #fff;
    }
    .block-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; min-width: 0; }
    .block-ico {
      width: 26px; height: 26px; border-radius: 7px; background: var(--wait-bg); color: var(--blue);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .block-head h2 { margin: 0; font-size: 13px; font-weight: 700; min-width: 0; }

    .btn-row { display: flex; flex-direction: column; gap: 6px; }
    .btn-row + .btn-row { margin-top: 6px; }
    .btn {
      width: 100%; flex: none; border: none; border-radius: 8px; cursor: pointer;
      padding: 8px 10px; font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { opacity: 0.92; }
    .btn-ghost {
      background: var(--soft); color: #334155; border: 1px solid var(--line);
    }
    .btn-ghost:disabled { color: var(--faint); cursor: not-allowed; }
    .btn-ghost:not(:disabled):hover { background: #eef2f7; }
    .btn-sm { padding: 8px 10px; font-size: 12px; font-weight: 600; }

    .block-status, .footer-status {
      font-size: 11px; line-height: 1.4; margin-top: 6px; padding: 6px 8px;
      border-radius: 7px; display: none; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .block-status.ok, .footer-status.ok { display: block; background: var(--ok-bg); color: var(--ok); }
    .block-status.err, .footer-status.err { display: block; background: var(--err-bg); color: var(--err); }
    .block-status.wait, .footer-status.wait { display: block; background: var(--wait-bg); color: var(--wait); }

    .how {
      margin: 2px 0 8px; border: 1px solid var(--line); border-radius: 8px;
      padding: 0 10px; background: var(--soft);
    }
    .how summary {
      cursor: pointer; font-size: 12px; font-weight: 600; color: #334155;
      padding: 7px 0; list-style: none; display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .how summary::-webkit-details-marker { display: none; }
    .how summary::after {
      content: ""; width: 6px; height: 6px; border-right: 2px solid var(--faint);
      border-bottom: 2px solid var(--faint); transform: rotate(45deg); margin-right: 2px; flex-shrink: 0;
    }
    .how[open] summary::after { transform: rotate(-135deg); margin-top: 3px; }
    .how-body { font-size: 11px; color: var(--muted); line-height: 1.45; padding: 0 0 8px; margin: 0; overflow-wrap: anywhere; }

    .btn-outline {
      width: 100%; border: 1px solid var(--line); background: #fff; color: #334155;
      border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-outline:hover { background: var(--soft); }
    .footer-hint { margin: 4px 0 0; font-size: 10px; color: var(--faint); text-align: center; line-height: 1.35; }

    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="chrome">
      <header class="head">
        <h1>Sổ &amp; báo cáo</h1>
        <div class="head-nav">
          <button type="button" class="nav-back" onclick="run('ops')">Mail</button>
          <button type="button" class="nav-back" onclick="run('trigger')">Lịch</button>
        </div>
      </header>
    </div>

    <div class="scroll">
      <section class="period">
        <label for="month">Kỳ dữ liệu</label>
        <div class="month-row">
          <button type="button" class="month-nav" id="prev" title="Tháng trước" aria-label="Tháng trước" onclick="shiftMonth(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <select id="month" onchange="onMonthChange()"></select>
          <button type="button" class="month-nav" id="next" title="Tháng sau" aria-label="Tháng sau" onclick="shiftMonth(1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <div class="period-msg wait" id="period-msg">Đang tải kỳ dữ liệu…</div>
      </section>

      <section class="block" id="block-log">
        <div class="block-head">
          <span class="block-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8M8 9h2"/></svg>
          </span>
          <h2>Sổ giao dịch</h2>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btn-view-log" disabled onclick="run('load','log')">Xem</button>
          <button type="button" class="btn btn-ghost" id="btn-edit-log" disabled onclick="run('edit','log')">Sửa gốc</button>
        </div>
        <div class="block-status" id="status-log"></div>
      </section>

      <section class="block" id="block-rpt">
        <div class="block-head">
          <span class="block-ico" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
          </span>
          <h2>Báo cáo</h2>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="btn-view-rpt" disabled onclick="run('load','report')">Xem</button>
          <button type="button" class="btn btn-ghost" id="btn-edit-rpt" disabled onclick="run('edit','report')">Sửa gốc</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh-rpt" disabled onclick="refreshReports(false)">Làm mới tháng</button>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh-all" disabled onclick="refreshReports(true)">Làm mới tất cả</button>
        </div>
        <div class="block-status" id="status-rpt" role="status" aria-live="polite"></div>
      </section>

      <details class="how">
        <summary>Cách hoạt động</summary>
        <p class="how-body">
          <strong>Xem</strong> nạp snapshot chỉ đọc vào View_Log / View_Report.
          <strong>Sửa gốc</strong> hiện sheet tháng trên tab.
          <strong>Làm mới</strong> tính lại Report từ sổ. Ẩn sheet thu gọn mọi tab Log/Report đang hiện.
        </p>
      </details>

      <div class="footer-actions">
        <button type="button" class="btn-outline" onclick="run('hide')">Ẩn sheet tháng đang hiện</button>
        <p class="footer-hint">Thu gọn mọi tab Log/Report đang mở</p>
        <div class="footer-status" id="status-footer"></div>
      </div>
    </div>
  </div>

  <script>
    var app = document.getElementById('app');
    var monthSel = document.getElementById('month');
    var periodMsg = document.getElementById('period-msg');
    var btnPrev = document.getElementById('prev');
    var btnNext = document.getElementById('next');
    var monthKeys = [];

    var actionBtns = [
      document.getElementById('btn-view-log'),
      document.getElementById('btn-edit-log'),
      document.getElementById('btn-view-rpt'),
      document.getElementById('btn-edit-rpt'),
      document.getElementById('btn-refresh-rpt'),
      document.getElementById('btn-refresh-all')
    ];

    function formatMonthDisplay(key) {
      var parts = String(key || '').split('_');
      if (parts.length === 2) return 'Tháng ' + parts[0] + ' / ' + parts[1];
      return String(key || '');
    }

    function sayPeriod(cls, msg) {
      periodMsg.className = 'period-msg' + (cls ? ' ' + cls : '');
      periodMsg.textContent = msg || '';
    }

    function sayBlock(kind, cls, msg) {
      var el = document.getElementById(kind === 'report' ? 'status-rpt' : 'status-log');
      el.className = 'block-status' + (cls ? ' ' + cls : '');
      el.textContent = msg || '';
    }

    function sayFooter(cls, msg) {
      var el = document.getElementById('status-footer');
      el.className = 'footer-status' + (cls ? ' ' + cls : '');
      el.textContent = msg || '';
    }

    function clearBlockStatus() {
      sayBlock('log', '', '');
      sayBlock('report', '', '');
    }

    var isBusy = false;
    function busy(on) {
      isBusy = on;
      app.className = on ? 'busy' : '';
      app.querySelectorAll('button, select').forEach(function (el) {
        if (on) {
          el.dataset.wasDisabled = el.disabled ? '1' : '0';
          el.disabled = true;
        } else {
          el.disabled = el.dataset.wasDisabled === '1';
        }
      });
    }

    function refreshReports(all) {
      if (isBusy || !monthSel.value) return;
      if (!(window.google && google.script && google.script.run)) return;
      if (all && !window.confirm('Tính lại báo cáo của tất cả tháng có Log? Có thể mất vài phút.')) return;
      var selected = monthSel.value;
      busy(true);
      clearBlockStatus();
      sayFooter('', '');
      sayBlock('report', 'wait', all ? 'Đang làm mới toàn bộ báo cáo…' : 'Đang làm mới báo cáo tháng đang chọn…');

      function finish(r) {
        var cls = (r && r.ok) ? 'ok' : 'err';
        var msg = (r && r.message) || (r && r.ok ? 'Hoàn tất.' : 'Không thực hiện được.');
        sayBlock('report', cls, msg);
        var rebuilt = r && r.rebuilt ? r.rebuilt : (r && r.ok && !all ? [selected] : []);
        if (rebuilt.indexOf(selected) >= 0) {
          sayBlock('report', 'wait', msg + ' — Đang cập nhật trang xem…');
          google.script.run
            .withSuccessHandler(function (vr) {
              busy(false);
              sayBlock('report', vr && vr.ok ? cls : 'err', msg + (vr && vr.ok ? '' : ' (cập nhật View thất bại)'));
            })
            .withFailureHandler(function (err) {
              busy(false);
              sayBlock('report', 'err', msg + ' — Lỗi cập nhật View: ' + ((err && err.message) || String(err)));
            })
            .viewSidebarLoad(selected, 'report');
        } else {
          busy(false);
        }
      }

      if (all) {
        google.script.run
          .withSuccessHandler(finish)
          .withFailureHandler(function (err) { busy(false); sayBlock('report', 'err', (err && err.message) || String(err)); })
          .viewSidebarRebuildAllReports();
      } else {
        google.script.run
          .withSuccessHandler(finish)
          .withFailureHandler(function (err) { busy(false); sayBlock('report', 'err', (err && err.message) || String(err)); })
          .viewSidebarRebuildReport(selected);
      }
    }

    function setActionsEnabled(on) {
      actionBtns.forEach(function (b) { b.disabled = !on; });
      monthSel.disabled = !on;
      syncMonthNav();
    }

    function syncMonthNav() {
      var idx = monthSel.selectedIndex;
      var n = monthKeys.length;
      btnPrev.disabled = !n || idx < 0 || idx >= n - 1;
      btnNext.disabled = !n || idx <= 0;
    }

    function onMonthChange() {
      syncMonthNav();
      clearBlockStatus();
      sayFooter('', '');
    }

    function shiftMonth(calendarDir) {
      if (!monthKeys.length) return;
      var idx = monthSel.selectedIndex;
      var next = idx - calendarDir;
      if (next < 0 || next >= monthKeys.length) return;
      monthSel.selectedIndex = next;
      onMonthChange();
    }

    function initState(state) {
      monthKeys = (state && state.months) ? state.months.map(function (m) { return m.key; }) : [];
      monthSel.innerHTML = '';

      if (!monthKeys.length) {
        var empty = document.createElement('option');
        empty.value = '';
        empty.textContent = 'Chưa có dữ liệu theo tháng';
        monthSel.appendChild(empty);
        setActionsEnabled(false);
        sayPeriod('', 'Chưa có dữ liệu theo tháng');
        return;
      }

      state.months.forEach(function (m) {
        var opt = document.createElement('option');
        opt.value = m.key;
        opt.textContent = formatMonthDisplay(m.key);
        if (m.key === state.selected) opt.selected = true;
        monthSel.appendChild(opt);
      });
      setActionsEnabled(true);
      sayPeriod('', '');
      syncMonthNav();
    }

    function waitMessage(action, kind) {
      var label = formatMonthDisplay(monthSel.value);
      if (action === 'load') {
        return kind === 'report'
          ? ('Đang mở báo cáo ' + label + '…')
          : ('Đang mở sổ giao dịch ' + label + '…');
      }
      if (action === 'edit') {
        return kind === 'report'
          ? ('Đang mở sheet gốc báo cáo ' + label + '…')
          : ('Đang mở sheet gốc sổ ' + label + '…');
      }
      if (action === 'hide') return 'Đang ẩn sheet tháng đang hiện…';
      return 'Đang xử lý…';
    }

    function statusTarget(action, kind) {
      if (action === 'hide') return 'footer';
      if (action === 'load' || action === 'edit') return kind === 'report' ? 'report' : 'log';
      return null;
    }

    function run(action, kind) {
      if (isBusy) return;
      if (action !== 'ops' && action !== 'trigger' && action !== 'hide' && !monthSel.value) return;
      if (!(window.google && google.script && google.script.run)) return;

      busy(true);
      clearBlockStatus();
      sayFooter('', '');

      var target = statusTarget(action, kind);
      if (target === 'footer') sayFooter('wait', waitMessage(action, kind));
      else if (target) sayBlock(target, 'wait', waitMessage(action, kind));

      var ok = function (r) {
        busy(false);
        if (action === 'ops' || action === 'trigger') return;
        var msg = (r && r.message) || (r && r.ok ? 'Hoàn tất.' : 'Không thực hiện được.');
        var cls = r && r.ok ? 'ok' : 'err';
        if (target === 'footer') sayFooter(cls, msg);
        else if (target) sayBlock(target, cls, msg);
      };
      var fail = function (err) {
        busy(false);
        var msg = (err && err.message) || String(err);
        if (target === 'footer') sayFooter('err', msg);
        else if (target) sayBlock(target, 'err', msg);
      };
      var runner = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);

      if (action === 'load') runner.viewSidebarLoad(monthSel.value, kind);
      else if (action === 'edit') runner.viewSidebarEdit(monthSel.value, kind);
      else if (action === 'ops') runner.showOpsSidebar();
      else if (action === 'trigger') runner.showOpsTriggerSidebar();
      else runner.viewSidebarHideShards();
    }

    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(initState)
        .withFailureHandler(function (err) {
          sayPeriod('err', (err && err.message) || String(err));
          setActionsEnabled(false);
        })
        .viewSidebarState();
    }
  </script>
</body>
</html>
